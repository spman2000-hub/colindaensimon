<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3c1724">
    <title>Dankjewel | Colinda &amp; Simon</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: 24px;
        color: #f5eee4;
        background:
          radial-gradient(circle at 72% 24%, rgba(212, 97, 53, .24), transparent 29%),
          #3c1724;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 620px; }
      .seal {
        display: grid;
        width: 58px;
        height: 58px;
        margin: 0 auto 27px;
        color: #d2a247;
        border: 1px solid rgba(210, 162, 71, .6);
        place-items: center;
        font-family: Georgia, serif;
        font-size: 26px;
      }
      h1 {
        margin: 0 0 18px;
        font-family: Georgia, serif;
        font-size: clamp(52px, 12vw, 90px);
        font-weight: 400;
        letter-spacing: -.055em;
        line-height: .95;
      }
      h1 em { color: #d2a247; font-weight: 400; }
      p { color: rgba(255,255,255,.67); line-height: 1.75; }
      a {
        display: inline-block;
        margin-top: 23px;
        padding: 14px 22px;
        color: #fff;
        background: #b8442c;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .12em;
        text-decoration: none;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="seal" aria-hidden="true">祝</span>
      <h1>Dank<em>jewel!</em></h1>
      <p>Jullie RSVP is ontvangen. We kijken ernaar uit om samen te proosten, te eten en te dansen op 3 oktober.</p>
      <a href="index.html">Terug naar de website</a>
    </main>
  </body>
</html>
